# OuterView news job: every 15 minutes, read GDELT's newest files and publish per-region story files on the
# `data` branch (rewritten each run so the repository stays small). Data: GDELT Project. Headline and link only.
name: news
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the current data branch
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out || mkdir -p out
          mkdir -p out/tiles
      - name: Build the tiles
        run: python3 -I gkg.py out/tiles
      - name: The Outer Index (one number per city for today)
        run: python3 -I index.py out/tiles cities.json
        continue-on-error: true
      - name: Upcoming launches (The Space Devs, at most once an hour)
        run: python3 -I launches.py out/tiles
        continue-on-error: true
      - name: Alert run (web push for watched places)
        env:
          PUSH_RUN_TOKEN: ${{ secrets.PUSH_RUN_TOKEN }}
        run: |
          if [ -n "$PUSH_RUN_TOKEN" ]; then curl -s -m 60 -X POST https://outerview.world/api/push/run -H "Authorization: Bearer $PUSH_RUN_TOKEN"; echo; fi
        continue-on-error: true
      - name: Publish the data branch
        working-directory: out
        run: |
          git init -q
          git checkout -q --orphan fresh
          git config user.name "outerview-news"
          git config user.email "news@outerview.pages.dev"
          cp ../DATA-README.md README.md
          git add -A
          git commit -q -m "tiles $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fresh:data
      # GitHub switches off the schedule of a public repository after 60 days with no activity, and it is not
      # written down whether this job's own pushes to the data branch count. So the job re-enables its own
      # workflow on every run: the 60 days start again, and the cron backstop below never goes away.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/news.yml/enable" && echo "schedule enabled"
        continue-on-error: true
      # GitHub runs a */15 cron only a few times a day when it is busy (2026-11-07: gaps of 5 to 8 hours), so the
      # job keeps its own clock: it waits 13 minutes and starts the next run itself. The cron is the backstop that
      # restarts the chain if a run fails. Set the repository variable NEWS_LOOP to "off" to stop it.
      # The site check (smoke.sh, a copy of world-view/scripts/smoke.sh): every tick, one self-closing issue here.
      - name: Check the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash smoke.sh | tee smoke.txt; then
            n=$(gh issue list --state open --search "Site check failed in:title" --json number --jq '.[0].number'); [ -n "$n" ] && gh issue close "$n" --comment "Green again at $(date -u +'%Y-%m-%d %H:%M') UTC." || true
          else
            n=$(gh issue list --state open --search "Site check failed in:title" --json number --jq '.[0].number')
            body=$(printf 'Checked %s UTC.\n\n```\n%s\n```' "$(date -u +'%Y-%m-%d %H:%M')" "$(grep -E '^FAIL' smoke.txt)")
            if [ -z "$n" ]; then gh issue create --title "Site check failed" --body "$body"; else gh issue comment "$n" --body "$body"; fi
          fi
      - name: Keep the clock
        if: ${{ vars.NEWS_LOOP != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # Hand off to the next run and make sure it started: on 2026-11-09 at 18:14 GitHub dropped a dispatched run
        # (it failed with no jobs) and the chain stopped for two hours. A dropped or missing run is asked for again,
        # up to three times. Only runs created after the hand-off count.
        run: |
          sleep 780
          for try in 1 2 3; do
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run news.yml --ref main || true
            sleep 45
            next=$(gh run list --workflow news.yml --limit 5 --json status,conclusion,createdAt --jq "map(select(.createdAt >= \"$since\")) | (.[0] // {}) | (.status // \"none\") + \" \" + (.conclusion // \"\")")
            echo "try $try: the next run is $next"
            case "$next" in none*|"completed failure"*|"completed startup_failure"*|"completed cancelled"*) sleep 15 ;; *) exit 0 ;; esac
          done
          echo "::warning::the next news run did not start after three tries; the 15-minute schedule will pick it up"
