name: places
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
    inputs:
      cities:
        description: 'cities this run'
        default: '400'
permissions:
  contents: write
  actions: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q overturemaps
      - run: python3 -I places/seed.py ${{ github.event.inputs.cities || '400' }}
      - name: Commit
        run: |
          git config user.name outerview-places
          git config user.email places@outerview.world
          git add places/data
          git diff --cached --quiet && echo "no change" || (git commit -q -m "places $(date -u +%F)" && git pull -q --rebase && git push -q)
      - name: Import into the database
        env:
          PUSH_RUN_TOKEN: ${{ secrets.PUSH_RUN_TOKEN }}
        run: |
          if [ -z "$PUSH_RUN_TOKEN" ]; then echo "no token, the site imports on first view"; exit 0; fi
          for i in $(seq 1 150); do r=$(curl -s -m 90 -X POST https://outerview.world/api/places/import -H "Authorization: Bearer $PUSH_RUN_TOKEN"); echo "$r"; case "$r" in *'"left":0'*|''|*error*) break;; esac; done
      # Keep going while cities are left (the 6-hour cron is only the backstop; GitHub throttles crons).
      - name: Continue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(python3 -c "import json; q=json.load(open('places/queue.json')); i=json.load(open('places/data/index.json')); print(sum(1 for c in q if c['id'] not in i))")
          echo "$left cities left"
          if [ "$left" -gt 0 ] && [ "${{ vars.PLACES_LOOP }}" != "off" ]; then gh workflow run places.yml --ref main -f cities=400; fi
